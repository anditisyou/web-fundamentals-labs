<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Registration Portal</title>
    <style>
        body {

            text-align: center;
            margin: 0;
            padding: 20px;
        }
        header {
            background-color: #ffffff;
            padding: 10px 0;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
        }
        h2{
            margin-top: 0;
        }
        marquee {
            background-color:  #e1ffe5;
            padding: 10px 0;
            margin-bottom: 20px;
            font-size: 18px;
            color: #003162;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <img src="/logo.png" alt="GEU Logo" width="100">
        <h1>GEU</h1>
    </header>
    <marquee behavior="scroll" direction="left" scrollamount="5">Welcome to Graphic Era University - Your Gateway to Excellence!</marquee>
    <h2>Welcome to the College Portal</h2>
    <button onclick="nextWin()">Register Now</button>
    <script src = "script.js"></script>
</body>
</html>
